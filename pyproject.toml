[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-process-model"
version = "0.1.0"
description = "text to process model"
requires-python = ">=3.10,<3.15"
authors = [
    {name = "Imed Kouki", email = "imed.kouki@rades.r-iset.tn"}
]

dependencies = [
    "langchain>=0.1.0",
    "langchain-mistralai>=0.1.0",
    "langchain-core>=0.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    # Pydantic V2 compatible
    "pydantic>=2.0,<3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "black>=25.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.4.0",
    "pytest-watch>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/being3iimed/Text-to-process-model"
Repository = "https://github.com/being3iimed/Text-to-process-model"

[tool.setuptools]
packages = ["agents", "config", "utils", "output", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "mock: Tests using mocks",
]

[tool.coverage.run]
source = ["agents", "utils", "output", "config"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
